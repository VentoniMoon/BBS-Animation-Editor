buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }

    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '0.1.0'
group = 'com.example.examplemod'
archivesBaseName = 'bbs-animation-editor'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

repositories {
    flatDir {
        dir 'libs'
    }
    // ASM overrides must resolve in local developer runs as well as CI.
    if (project.hasProperty('fixMixinAsm')) {
        mavenCentral()
    }
    // CI can compile against the exact public 1.12.2 McHorse mod releases
    // when the user's local run/mods directory is intentionally absent.
    if (project.hasProperty('ciDependencies')) {
        // Forge's public Scala/Java transitive dependencies should resolve
        // from Maven Central, not through CurseMaven (which can time out).
        mavenCentral()
        // McHorse runtime mod artifacts are available through CurseMaven.
        maven { url 'https://cursemaven.com/' }
    }
}

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'

    // The bundled 1.12.2 CTM mod registers its texture metadata through
    // Minecraft.metadataSerializer_. In a deobfuscated ForgeGradle client,
    // ATs declared by runtime run/mods jars may not transform Minecraft.
    // Apply CTM's own SRG field rule at the workspace level as well.
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            // Opt-in isolated modpack/world stress profile. Normal runClient
            // and its existing run/mods, saves and configuration are unchanged.
            workingDirectory project.file(
                    project.hasProperty('stressTest') ? 'run-stress' : 'run')

            // Opt-in classloader diagnostic for old Forge/Mixin/ASM conflicts.
            // Capture the runClient console to locate the *actual* ASM JAR
            // supplying org.objectweb.asm.ClassReader (rather than guessing
            // from Gradle dependency lists or modifying user mods).
            if (project.hasProperty('diagnoseAsmClasspath')) {
                jvmArg '-verbose:class'
            }

            // Modern BetterLights Mixin needs ASM 9.x, but Forge 1.12's
            // event hierarchy occasionally loses generated per-event
            // ListenerList methods in this combined dev environment.
            // Use our narrow, Forge-compatible fallback ONLY in that
            // opt-in Mixin/ASM test profile (normal editor unchanged).
            if (project.hasProperty('fixMixinAsm')) {
                property 'bbs.editor.forgeEventIsolation',
                        System.getProperty('bbs.editor.forgeEventIsolation',
                                'true')
                // Known ForgeGradle#748: contaminated Side.BUKKIT makes FML
                // NetworkRegistry.newChannel() dereference a missing map.
                // Patch only the two valid network sides, not the enum itself.
                property 'bbs.editor.forgeNetworkSideGuard',
                        System.getProperty('bbs.editor.forgeNetworkSideGuard',
                                'true')

                // Runtime mods such as MalisisCore bundle production (SRG)
                // Mixin refmaps. A ForgeGradle MCP dev client uses method
                // names like processPlayerDigging, but their refmaps target
                // func_147345_a. Tell Mixin to remap those references using
                // ForgeGradle's generated SRG -> MCP mapping file.
                // Do not disable refmaps: that breaks mods built with
                // different mapping snapshots.
                def srgToMcp = project.file('build/createSrgToMcp/output.srg')
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile',
                        srgToMcp.absolutePath
                property 'net.minecraftforge.gradle.GradleStart.srg.srg-mcp',
                        srgToMcp.absolutePath

                // MalisisCore's injected methods may retain production
                // SRG calls despite refmap target remapping:
                // IBlockState.func_177230_c() and (on MalisisDoors ticks)
                // Chunk.func_177435_g(BlockPos). Supply dev-only aliases to
                // MCP getBlock() and getBlockState(BlockPos). Never touch
                // the release mod or any third-party JAR.
                property 'bbs.editor.mcpBlockStateSrgBridge',
                        System.getProperty('bbs.editor.mcpBlockStateSrgBridge',
                                'true')
            }

            // Explicit opt-in for the private multipass BSL mirror renderer.
            // This is independent of ASM / Jolt stress testing. Do not enable
            // it silently in packaged or ordinary development builds; the
            // full BSL compositor is still experimental.
            if (project.hasProperty('enableExperimentalBSLMirror')) {
                property 'bbs.editor.camera.mirrorBSLExperimental', 'true'
            }

            // Explicit A/B switch for the experimental render-only
            // Chameleon Weld preview. Defaults OFF for normal sessions.
            property 'bbs.editor.weld.preview',
                    System.getProperty('bbs.editor.weld.preview', 'false')

            // Load the same early shader core plugin used by the packaged JAR.
            // This must precede OptiFine's first Shaders class load.
            property 'fml.coreMods.load',
                    'com.example.examplemod.CameraShaderCurveCorePlugin'

            // OFF by default: enables Ctrl+Shift+F9 single-frame native
            // output-resolution PNG probe in CAMERA for render diagnostics.
            property 'bbs.editor.export.probe',
                    System.getProperty('bbs.editor.export.probe', 'false')
            // Optional full-pixel IMAGE/SUBTITLE compositing test.
            // This remains disabled unless the user explicitly opts in.
            property 'bbs.editor.export.probe.media',
                    System.getProperty('bbs.editor.export.probe.media', 'false')
            // Experiment: the external FFmpeg 7.1 essentials executable,
            // or the system PATH "ffmpeg" default. Never bundled in the JAR.
            property 'bbs.editor.export.ffmpeg',
                    System.getProperty('bbs.editor.export.ffmpeg', 'ffmpeg')
            // Test the BetterLights shadow path separately from point
            // lighting inside the experimental BSL planar mirror.
            // Off by default; -D...=true changes only mirror shaders.
            property 'bbs.editor.camera.mirrorBSLDisableBetterLightsShadows',
                    System.getProperty(
                            'bbs.editor.camera.mirrorBSLDisableBetterLightsShadows',
                            'false')
            // Re-evaluate BetterLights for the reflected camera even when
            // a native OptiFine program already reports lightCount > 0.
            // Disable to A/B compare and isolate any performance regression.
            property 'bbs.editor.camera.mirrorBSLForceNativeLightRefresh',
                    System.getProperty(
                            'bbs.editor.camera.mirrorBSLForceNativeLightRefresh',
                            'true')
            // Explicit opt-in to inspect the actual OptiFine + BetterLights
            // fragment math used by the mirror. Writes one local .fsh file
            // to the game's debug directory; never uploads it.
            property 'bbs.editor.camera.mirrorBSLDumpBetterLightsGLSL',
                    System.getProperty(
                            'bbs.editor.camera.mirrorBSLDumpBetterLightsGLSL',
                            'false')
            property 'bbs.editor.camera.mirrorBSLNativeLightRefresh',
                    System.getProperty(
                            'bbs.editor.camera.mirrorBSLNativeLightRefresh',
                            'true')
            // Experimental late actor shadows in the MAIN native OptiFine
            // shadow depth atlas; disabled until user visual validation.
            property 'bbs.editor.camera.nativeActorSunShadows',
                    System.getProperty(
                            'bbs.editor.camera.nativeActorSunShadows',
                            'false')
            // A/B diagnostics: keeps early actor pose preparation while
            // preventing native shadow depth texture writes.
            property 'bbs.editor.camera.nativeActorSunShadows.skipOverlay',
                    System.getProperty(
                            'bbs.editor.camera.nativeActorSunShadows.skipOverlay',
                            'false')
            // Diagnose black backgrounds behind ALL text when a BSL
            // mirror is in view. The normal GUI resync is enabled;
            // passing false isolates it without touching mirror shading.
            property 'bbs.editor.camera.mirrorGuiFontState',
                    System.getProperty(
                            'bbs.editor.camera.mirrorGuiFontState',
                            'true')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'

    // ForgeGradle's MergeTool is a build tool, NOT a mod/runtime library.
    // Do not put a MergeTool JAR on the game classpath. The opt-in
    // ForgeNetworkSideGuardTransformer handles unexpected Side.BUKKIT.

    if (project.hasProperty('ciDependencies')) {
        // Exact versions already used in the user's dev modpack.
        // Blockbuster 2.7.1 / McLib 2.4.3 / Emoticons 1.1.2
        compile fg.deobf('curse.maven:blockbuster-254152:5492194')
        compile fg.deobf('curse.maven:mchorses-mclib-304750:5440933')
        compileOnly fg.deobf('curse.maven:emoticons-311624:4528666')
    } else {
        // Existing local Forge workspace remains entirely unchanged.
        compile files('run/mods/blockbuster-2.7.1-1.12.2.jar')
        compileOnly files('run/mods/emoticons-1.1.2-1.12.2.jar')
        compile files('run/mods/mclib-2.4.3-1.12.2.jar')
    }

    if (project.hasProperty('ciDependencies')) {
        // CI repository JARs are not guaranteed to be real ZIP archives
        // (e.g. Git LFS pointers). Resolve the actual published releases.
        compile fg.deobf('curse.maven:metamorph-256932:5440927')
        compile fg.deobf('curse.maven:aperture-271561:5440944')
    } else {
        // Keep the user's existing local workspace coordinates untouched.
        compile fg.deobf('blank:metamorph-1.4:1.12.2')
        compile fg.deobf('blank:aperture-1.8.2:1.12.2')
    }
}

/*
 * Opt-in ASM runtime override for the *new* Mixin bundled by BetterLights.
 *
 * ForgeGradle's 1.12.2 launch classpath currently selects asm-6.0.jar,
 * while Mixin's LanguageFeatures directly references ConstantDynamic.
 * This class was added in ASM 6.2; recent Mixin also uses ASM 9.x APIs.
 * Match the entire ASM family at 9.6 so tree/commons/analysis/util do
 * not accidentally mix old and new versions during class transformation.
 *
 * Deliberately runtime-only and opt-in: the normal editor launch and
 * the ForgeGradle build plugin's own classloader are not modified.
 * Test with: runClient -PfixMixinAsm -PenableJoltExperimental
 */
if (project.hasProperty('fixMixinAsm')) {
    def asmVersion = '9.6'
    def asmModules = ['asm', 'asm-tree', 'asm-commons', 'asm-analysis', 'asm-util']

    configurations.all {
        if (name == 'runtimeClasspath' || name == 'runtime') {
            resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.ow2.asm'
                        && asmModules.contains(details.requested.name)) {
                    details.useVersion(asmVersion)
                }
            }
        }
    }

    dependencies {
        asmModules.each { moduleName ->
            runtimeOnly "org.ow2.asm:${moduleName}:${asmVersion}"
        }
    }
}

/*
 * Native Jolt is an opt-in EXPERIMENTAL preview for Java 8.
 *
 * Obtain the two JARs from the jolt-java8-experimental-jars GitHub Actions
 * artifact and put them in libs/. Without -PenableJoltExperimental the
 * existing editor builds exactly as before, with no Jolt dependency.
 *
 * The native DLL/SO is already embedded as a classpath resource inside the
 * bundled JNI JAR. Repackage the content into our Forge mod, not as extra
 * "mods" JARs: Jolt's own JAR has no Forge @Mod entrypoint.
 */
if (project.hasProperty('enableJoltExperimental')) {
    def joltJava8 = file('libs/jolt-jni-6.0.0-java8-bundled.jar')
    def joltPrototype = file('libs/jolt-hair-prototype-java8.jar')
    if (!joltJava8.isFile() || !joltPrototype.isFile()) {
        throw new GradleException('Experimental Jolt artifacts missing. ' +
                'Place jolt-jni-6.0.0-java8-bundled.jar and ' +
                'jolt-hair-prototype-java8.jar in libs/ before building.')
    }
    dependencies {
        compile files(joltJava8)
        compile files(joltPrototype)
    }
    jar {
        from(zipTree(joltJava8)) {
            exclude 'META-INF/**'
        }
        from(zipTree(joltPrototype)) {
            exclude 'META-INF/**'
        }
    }
}

jar {
    manifest {
        attributes([
                "FMLCorePlugin": "com.example.examplemod.CameraShaderCurveCorePlugin",
                "FMLCorePluginContainsFMLMod": "true",
                "Specification-Title": "bbsanimationeditor",
                "Specification-Vendor": "VentoniMoon",
                "Specification-Version": "${version}",
                "Implementation-Title": project.name,
                "Implementation-Version": "${version}",
                "Implementation-Vendor": "VentoniMoon",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }

    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}