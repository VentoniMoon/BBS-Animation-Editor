buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }

    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '1.0'
group = 'com.example.examplemod'
archivesBaseName = 'bbs-animation-editor'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

repositories {
    flatDir {
        dir 'libs'
    }
}

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'

    runs {
        client {
            workingDirectory project.file('run')

            // Explicit A/B switch for the experimental render-only
            // Chameleon Weld preview. Defaults OFF for normal sessions.
            property 'bbs.editor.weld.preview',
                    System.getProperty('bbs.editor.weld.preview', 'false')

            // Only actor placement in the native world pass is experimental.
            // BBS FS-style world capture itself is always used on this branch.
            property 'bbs.editor.preview3.nativeActors',
                    System.getProperty('bbs.editor.preview3.nativeActors', 'false')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'

    compile files('run/mods/blockbuster-2.7.1-1.12.2.jar')
    compileOnly files('run/mods/emoticons-1.1.2-1.12.2.jar')
    compile files('run/mods/mclib-2.4.3-1.12.2.jar')

    compile fg.deobf('blank:metamorph-1.4:1.12.2')
    compile fg.deobf('blank:aperture-1.8.2:1.12.2')
}

/*
 * Native Jolt is an opt-in EXPERIMENTAL preview for Java 8.
 *
 * Obtain the two JARs from the jolt-java8-experimental-jars GitHub Actions
 * artifact and put them in libs/. Without -PenableJoltExperimental the
 * existing editor builds exactly as before, with no Jolt dependency.
 *
 * The native DLL/SO is already embedded as a classpath resource inside the
 * bundled JNI JAR. Repackage the content into our Forge mod, not as extra
 * "mods" JARs: Jolt's own JAR has no Forge @Mod entrypoint.
 */
if (project.hasProperty('enableJoltExperimental')) {
    def joltJava8 = file('libs/jolt-jni-6.0.0-java8-bundled.jar')
    def joltPrototype = file('libs/jolt-hair-prototype-java8.jar')
    if (!joltJava8.isFile() || !joltPrototype.isFile()) {
        throw new GradleException('Experimental Jolt artifacts missing. ' +
                'Place jolt-jni-6.0.0-java8-bundled.jar and ' +
                'jolt-hair-prototype-java8.jar in libs/ before building.')
    }
    dependencies {
        compile files(joltJava8)
        compile files(joltPrototype)
    }
    jar {
        from(zipTree(joltJava8)) {
            exclude 'META-INF/**'
        }
        from(zipTree(joltPrototype)) {
            exclude 'META-INF/**'
        }
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title": "bbsanimationeditor",
                "Specification-Vendor": "examplemod",
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": "${version}",
                "Implementation-Vendor": "examplemod",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }

    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}