name: CAMERA mirror isolated renderer Java 8

on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/com/example/examplemod/CameraMirrorWorldIsolation.java'
      - 'src/test/java/com/example/examplemod/CameraMirrorWorldIsolationSmokeTest.java'
      - 'src/test/mirror-world-stubs/**'
      - '.github/workflows/camera-mirror-isolation.yml'
  pull_request:
    paths:
      - 'src/main/java/com/example/examplemod/CameraMirrorWorldIsolation.java'
      - 'src/test/java/com/example/examplemod/CameraMirrorWorldIsolationSmokeTest.java'
      - 'src/test/mirror-world-stubs/**'
  workflow_dispatch:

jobs:
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile and test mirror RenderGlobal ownership
        run: |
          mkdir -p build/mirror-world-test
          javac -source 8 -target 8 -encoding UTF-8 -d build/mirror-world-test \
            src/test/mirror-world-stubs/net/minecraft/client/Minecraft.java \
            src/test/mirror-world-stubs/net/minecraft/client/multiplayer/WorldClient.java \
            src/test/mirror-world-stubs/net/minecraft/client/renderer/RenderGlobal.java \
            src/main/java/com/example/examplemod/CameraMirrorWorldIsolation.java \
            src/test/java/com/example/examplemod/CameraMirrorWorldIsolationSmokeTest.java
          java -ea -cp build/mirror-world-test \
            com.example.examplemod.CameraMirrorWorldIsolationSmokeTest
