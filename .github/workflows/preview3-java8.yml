name: Preview FS native renderer Java 8

on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/com/example/examplemod/EditorCamera.java'
      - 'src/main/java/com/example/examplemod/PreviewCameraPose.java'
      - 'src/main/java/com/example/examplemod/PreviewCameraProjection.java'
      - 'src/main/java/com/example/examplemod/PreviewCameraMatrices.java'
      - 'src/main/java/com/example/examplemod/JoltContactScreenProjection.java'
      - 'src/main/java/com/example/examplemod/PreviewSceneRenderCoordinator.java'
      - 'src/main/java/com/example/examplemod/BbsFsNativeActorPass.java'
      - 'src/main/java/com/example/examplemod/BbsFsWorldFrameCapture.java'
      - 'src/main/java/com/example/examplemod/BbsFsWorldCameraDriver.java'
      - 'src/main/java/com/example/examplemod/BbsFsWorldProjection.java'
      - 'src/main/java/com/example/examplemod/BbsFsCameraConventions.java'
      - 'src/main/java/com/example/examplemod/BbsFsPreviewTarget.java'
      - 'src/main/java/com/example/examplemod/EditorSceneViewport.java'
      - 'src/main/java/com/example/examplemod/EditorMultiActorPreviewController.java'
      - 'src/main/java/com/example/examplemod/EditorGizmoController.java'
      - 'src/main/java/com/example/examplemod/BlockbusterActorPreviewRenderer.java'
      - 'src/main/java/com/example/examplemod/AnimationEditorScreen.java'
      - 'src/main/java/com/example/examplemod/CameraMathExpression.java'
      - 'src/test/java/com/example/examplemod/CameraMathExpressionSmokeTest.java'
      - 'src/test/java/com/example/examplemod/Preview3*Test.java'
      - 'src/test/preview3-stubs/**'
      - 'src/test/preview3-fs-stubs/**'
      - 'src/test/preview3-optifine-stubs/**'
      - 'src/test/preview3-fs-bridge-stubs/**'
      - '.github/workflows/preview3-java8.yml'
  pull_request:
    paths:
      - 'src/main/java/com/example/examplemod/EditorCamera.java'
      - 'src/main/java/com/example/examplemod/PreviewCameraPose.java'
      - 'src/main/java/com/example/examplemod/PreviewCameraProjection.java'
      - 'src/main/java/com/example/examplemod/PreviewCameraMatrices.java'
      - 'src/main/java/com/example/examplemod/JoltContactScreenProjection.java'
      - 'src/main/java/com/example/examplemod/PreviewSceneRenderCoordinator.java'
      - 'src/main/java/com/example/examplemod/BbsFsNativeActorPass.java'
      - 'src/main/java/com/example/examplemod/BbsFsWorldFrameCapture.java'
      - 'src/main/java/com/example/examplemod/BbsFsWorldCameraDriver.java'
      - 'src/main/java/com/example/examplemod/BbsFsWorldProjection.java'
      - 'src/main/java/com/example/examplemod/BbsFsCameraConventions.java'
      - 'src/main/java/com/example/examplemod/BbsFsPreviewTarget.java'
      - 'src/main/java/com/example/examplemod/EditorSceneViewport.java'
      - 'src/main/java/com/example/examplemod/EditorMultiActorPreviewController.java'
      - 'src/main/java/com/example/examplemod/EditorGizmoController.java'
      - 'src/main/java/com/example/examplemod/BlockbusterActorPreviewRenderer.java'
      - 'src/main/java/com/example/examplemod/AnimationEditorScreen.java'
      - 'src/main/java/com/example/examplemod/CameraMathExpression.java'
      - 'src/test/java/com/example/examplemod/CameraMathExpressionSmokeTest.java'
      - 'src/test/java/com/example/examplemod/Preview3*Test.java'
      - 'src/test/preview3-stubs/**'
      - 'src/test/preview3-fs-stubs/**'
      - 'src/test/preview3-optifine-stubs/**'
      - 'src/test/preview3-fs-bridge-stubs/**'
  workflow_dispatch:

jobs:
  java8-camera-scene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Compile camera math and run pixel/ray tests
        run: |
          mkdir -p build/preview3/camera
          javac -source 8 -target 8 -encoding UTF-8 -d build/preview3/camera \
            src/main/java/com/example/examplemod/EditorCamera.java \
            src/main/java/com/example/examplemod/BbsFsCameraConventions.java \
            src/main/java/com/example/examplemod/PreviewCameraPose.java \
            src/main/java/com/example/examplemod/PreviewCameraProjection.java \
            src/main/java/com/example/examplemod/PreviewCameraMatrices.java \
            src/main/java/com/example/examplemod/JoltContactScreenProjection.java \
            src/test/java/com/example/examplemod/Preview3CameraSmokeTest.java
          java -ea -cp build/preview3/camera \
            com.example.examplemod.Preview3CameraSmokeTest

      - name: Compile scene coordinator and test actor order / GL cleanup
        run: |
          mkdir -p build/preview3/scene
          javac -source 8 -target 8 -encoding UTF-8 -d build/preview3/scene \
            src/test/preview3-stubs/net/minecraft/client/Minecraft.java \
            src/test/preview3-stubs/com/example/examplemod/Preview3Stubs.java \
            src/main/java/com/example/examplemod/PreviewSceneRenderCoordinator.java \
            src/test/java/com/example/examplemod/Preview3CoordinatorSmokeTest.java
          java -ea -cp build/preview3/scene \
            com.example.examplemod.Preview3CoordinatorSmokeTest

      - name: Compile FS native actor pass and verify single-render ownership
        run: |
          mkdir -p build/preview3/fs-actors
          javac -source 8 -target 8 -encoding UTF-8 -d build/preview3/fs-actors \
            src/test/preview3-fs-stubs/net/minecraft/client/Minecraft.java \
            src/test/preview3-fs-stubs/net/minecraft/client/shader/Framebuffer.java \
            src/test/preview3-fs-stubs/com/example/examplemod/BbsFsNativeActorStubs.java \
            src/main/java/com/example/examplemod/BbsFsNativeActorPass.java \
            src/test/java/com/example/examplemod/Preview3FsNativeActorSmokeTest.java
          java -ea -cp build/preview3/fs-actors \
            com.example.examplemod.Preview3FsNativeActorSmokeTest

      - name: Compile FS frame capture and verify native FBO/GL lifecycle
        run: |
          mkdir -p build/preview3/fs-render
          javac -source 8 -target 8 -encoding UTF-8 -d build/preview3/fs-render \
            src/test/preview3-fs-bridge-stubs/org/lwjgl/BufferUtils.java \
            src/test/preview3-fs-bridge-stubs/org/lwjgl/opengl/GL11.java \
            src/test/preview3-fs-bridge-stubs/org/lwjgl/opengl/GL13.java \
            src/test/preview3-fs-bridge-stubs/org/lwjgl/opengl/GL20.java \
            src/test/preview3-fs-bridge-stubs/org/lwjgl/opengl/GL30.java \
            src/test/preview3-fs-bridge-stubs/net/minecraft/client/Minecraft.java \
            src/test/preview3-fs-bridge-stubs/net/minecraft/client/gui/ScaledResolution.java \
            src/test/preview3-fs-bridge-stubs/net/minecraft/client/shader/Framebuffer.java \
            src/test/preview3-fs-bridge-stubs/net/minecraft/client/renderer/entity/RenderManager.java \
            src/test/preview3-fs-bridge-stubs/com/example/examplemod/BbsFsBridgeStubs.java \
            src/main/java/com/example/examplemod/BbsFsPreviewTarget.java \
            src/main/java/com/example/examplemod/BbsFsWorldFrameCapture.java \
            src/main/java/com/example/examplemod/BbsFsWorldProjection.java \
            src/main/java/com/example/examplemod/BbsFsWorldGlGuard.java \
            src/test/java/com/example/examplemod/Preview3FsFramebufferSmokeTest.java
          java -ea -cp build/preview3/fs-render \
            com.example.examplemod.Preview3FsFramebufferSmokeTest

      - name: Compile and test OptiFine native entity shader state bridge
        run: |
          mkdir -p build/preview3/optifine
          javac -source 8 -target 8 -encoding UTF-8 -d build/preview3/optifine \
            src/test/preview3-optifine-stubs/net/minecraft/entity/Entity.java \
            src/test/preview3-optifine-stubs/net/optifine/shaders/Shaders.java \
            src/main/java/com/example/examplemod/BbsFsOptiFineEntityStage.java \
            src/test/java/com/example/examplemod/Preview3OptiFineEntityStageSmokeTest.java
          java -ea -cp build/preview3/optifine \
            com.example.examplemod.Preview3OptiFineEntityStageSmokeTest

      - name: CAMERA deterministic procedural math clips
        run: |
          mkdir -p build/camera/math
          javac -source 8 -target 8 -encoding UTF-8 -d build/camera/math \
            src/main/java/com/example/examplemod/PreviewCameraPose.java \
            src/main/java/com/example/examplemod/CameraMathExpression.java \
            src/test/java/com/example/examplemod/CameraMathExpressionSmokeTest.java
          java -ea -cp build/camera/math \
            com.example.examplemod.CameraMathExpressionSmokeTest
