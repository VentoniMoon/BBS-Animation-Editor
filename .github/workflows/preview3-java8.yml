name: Preview 3.0 Java 8 core

on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/com/example/examplemod/EditorCamera.java'
      - 'src/main/java/com/example/examplemod/PreviewCameraPose.java'
      - 'src/main/java/com/example/examplemod/PreviewCameraProjection.java'
      - 'src/main/java/com/example/examplemod/JoltContactScreenProjection.java'
      - 'src/main/java/com/example/examplemod/PreviewSceneRenderCoordinator.java'
      - 'src/test/java/com/example/examplemod/Preview3*Test.java'
      - 'src/test/preview3-stubs/**'
      - '.github/workflows/preview3-java8.yml'
  pull_request:
    paths:
      - 'src/main/java/com/example/examplemod/EditorCamera.java'
      - 'src/main/java/com/example/examplemod/PreviewCameraPose.java'
      - 'src/main/java/com/example/examplemod/PreviewCameraProjection.java'
      - 'src/main/java/com/example/examplemod/JoltContactScreenProjection.java'
      - 'src/main/java/com/example/examplemod/PreviewSceneRenderCoordinator.java'
      - 'src/test/java/com/example/examplemod/Preview3*Test.java'
      - 'src/test/preview3-stubs/**'
  workflow_dispatch:

jobs:
  java8-camera-scene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Compile camera math and run pixel/ray tests
        run: |
          mkdir -p build/preview3/camera
          javac -source 8 -target 8 -encoding UTF-8 -d build/preview3/camera \
            src/main/java/com/example/examplemod/EditorCamera.java \
            src/main/java/com/example/examplemod/PreviewCameraPose.java \
            src/main/java/com/example/examplemod/PreviewCameraProjection.java \
            src/main/java/com/example/examplemod/JoltContactScreenProjection.java \
            src/test/java/com/example/examplemod/Preview3CameraSmokeTest.java
          java -ea -cp build/preview3/camera \
            com.example.examplemod.Preview3CameraSmokeTest

      - name: Compile scene coordinator and test actor order / GL cleanup
        run: |
          mkdir -p build/preview3/scene
          javac -source 8 -target 8 -encoding UTF-8 -d build/preview3/scene \
            src/test/preview3-stubs/net/minecraft/client/Minecraft.java \
            src/test/preview3-stubs/com/example/examplemod/Preview3Stubs.java \
            src/main/java/com/example/examplemod/PreviewSceneRenderCoordinator.java \
            src/test/java/com/example/examplemod/Preview3CoordinatorSmokeTest.java
          java -ea -cp build/preview3/scene \
            com.example.examplemod.Preview3CoordinatorSmokeTest
