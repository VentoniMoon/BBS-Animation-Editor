name: CAMERA export Java 8 smoke

on:
  pull_request:
    paths:
      - 'src/main/java/com/example/examplemod/CameraExport*.java'
      - 'src/main/java/com/example/examplemod/CameraFfmpegEncoder.java'
      - 'src/main/java/com/example/examplemod/CameraExportVerifier.java'
      - 'src/main/java/com/example/examplemod/CameraExportReadback.java'
      - 'src/main/java/com/example/examplemod/CameraExportFrameBridge.java'
      - 'src/test/camera-export-stubs/**'
      - 'src/test/java/com/example/examplemod/CameraExportReadbackSmokeTest.java'
      - 'src/main/java/com/example/examplemod/CameraExportSession.java'
      - 'src/main/java/com/example/examplemod/CameraExportAudioMuxer.java'
      - 'src/main/java/com/example/examplemod/CameraExportAudioTracks.java'
      - 'src/main/java/com/example/examplemod/CameraExportPreferences.java'
      - 'src/test/java/com/example/examplemod/CameraExportAudioMuxerSmokeTest.java'
      - 'src/test/java/com/example/examplemod/CameraExportAudioTracksSmokeTest.java'
      - 'src/test/camera-audio-export-stubs/**'
      - 'src/test/java/com/example/examplemod/CameraExportSessionSmokeTest.java'
      - 'src/main/java/com/example/examplemod/CameraNativeFrameProbe.java'
      - 'src/main/java/com/example/examplemod/CameraVideoRenderController.java'
      - 'src/main/java/com/example/examplemod/CameraFilmCompositor.java'
      - 'src/main/java/com/example/examplemod/CameraWorkspace.java'
      - 'src/main/java/com/example/examplemod/AnimationEditorScreen.java'
      - 'src/main/java/com/example/examplemod/PreviewToolbarIcons.java'
      - 'src/test/java/com/example/examplemod/CameraExportVideoDecoderSmokeTest.java'
      - 'src/test/java/com/example/examplemod/CameraExportVideoSeekSmokeTest.java'
      - 'src/test/java/com/example/examplemod/CameraExportVideoFramesSmokeTest.java'
      - 'src/test/camera-video-export-stubs/**'
      - 'src/test/camera-native-probe-stubs/**'
      - 'src/test/java/com/example/examplemod/CameraNativeFrameProbeSmokeTest.java'
      - 'src/test/java/com/example/examplemod/CameraExportCoreSmokeTest.java'
      - 'src/test/java/com/example/examplemod/CameraExportCameraSamplerSmokeTest.java'
      - 'src/main/java/com/example/examplemod/CameraImagePlacement.java'
      - 'src/main/java/com/example/examplemod/CameraImageCache.java'
      - 'src/main/java/com/example/examplemod/CameraFilmCompositor.java'
      - 'src/main/java/com/example/examplemod/CameraClipParameters.java'
      - 'src/main/java/com/example/examplemod/CameraClipInspector.java'
      - 'src/test/java/com/example/examplemod/CameraImagePlacementSmokeTest.java'
      - 'src/main/java/com/example/examplemod/CameraExportActorFrameSampler.java'
      - 'src/main/java/com/example/examplemod/CameraExportRenderClock.java'
      - 'src/test/camera-fps-stubs/**'
      - 'src/test/java/com/example/examplemod/CameraExportActorFrameSamplerSmokeTest.java'
      - '.github/workflows/camera-export-java8.yml'
  push:
    branches: [main]
    paths:
      - 'src/main/java/com/example/examplemod/CameraExport*.java'
      - 'src/main/java/com/example/examplemod/CameraFfmpegEncoder.java'
      - 'src/main/java/com/example/examplemod/CameraExportVerifier.java'
      - 'src/main/java/com/example/examplemod/CameraExportReadback.java'
      - 'src/main/java/com/example/examplemod/CameraExportFrameBridge.java'
      - 'src/test/camera-export-stubs/**'
      - 'src/test/java/com/example/examplemod/CameraExportReadbackSmokeTest.java'
      - 'src/main/java/com/example/examplemod/CameraExportSession.java'
      - 'src/main/java/com/example/examplemod/CameraExportAudioMuxer.java'
      - 'src/main/java/com/example/examplemod/CameraExportAudioTracks.java'
      - 'src/main/java/com/example/examplemod/CameraExportPreferences.java'
      - 'src/test/java/com/example/examplemod/CameraExportAudioMuxerSmokeTest.java'
      - 'src/test/java/com/example/examplemod/CameraExportAudioTracksSmokeTest.java'
      - 'src/test/camera-audio-export-stubs/**'
      - 'src/test/java/com/example/examplemod/CameraExportSessionSmokeTest.java'
      - 'src/main/java/com/example/examplemod/CameraNativeFrameProbe.java'
      - 'src/main/java/com/example/examplemod/CameraVideoRenderController.java'
      - 'src/main/java/com/example/examplemod/CameraFilmCompositor.java'
      - 'src/main/java/com/example/examplemod/CameraWorkspace.java'
      - 'src/main/java/com/example/examplemod/AnimationEditorScreen.java'
      - 'src/main/java/com/example/examplemod/PreviewToolbarIcons.java'
      - 'src/test/java/com/example/examplemod/CameraExportVideoDecoderSmokeTest.java'
      - 'src/test/java/com/example/examplemod/CameraExportVideoSeekSmokeTest.java'
      - 'src/test/java/com/example/examplemod/CameraExportVideoFramesSmokeTest.java'
      - 'src/test/camera-video-export-stubs/**'
      - 'src/test/camera-native-probe-stubs/**'
      - 'src/test/java/com/example/examplemod/CameraNativeFrameProbeSmokeTest.java'
      - 'src/test/java/com/example/examplemod/CameraExportCoreSmokeTest.java'
      - 'src/test/java/com/example/examplemod/CameraExportCameraSamplerSmokeTest.java'
      - 'src/main/java/com/example/examplemod/CameraImagePlacement.java'
      - 'src/main/java/com/example/examplemod/CameraImageCache.java'
      - 'src/main/java/com/example/examplemod/CameraFilmCompositor.java'
      - 'src/main/java/com/example/examplemod/CameraClipParameters.java'
      - 'src/main/java/com/example/examplemod/CameraClipInspector.java'
      - 'src/test/java/com/example/examplemod/CameraImagePlacementSmokeTest.java'
      - 'src/main/java/com/example/examplemod/CameraExportActorFrameSampler.java'
      - 'src/main/java/com/example/examplemod/CameraExportRenderClock.java'
      - 'src/test/camera-fps-stubs/**'
      - 'src/test/java/com/example/examplemod/CameraExportActorFrameSamplerSmokeTest.java'
      - '.github/workflows/camera-export-java8.yml'
  workflow_dispatch:

jobs:
  camera-export-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Install external FFmpeg to verify real MP4 encoding
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -encoders | grep libx264
      - name: Compile export pipeline and run frame/MP4 tests
        run: |
          mkdir -p build/camera/export
          javac -source 8 -target 8 -encoding UTF-8 -d build/camera/export \
            src/main/java/com/example/examplemod/CameraExportPlan.java \
            src/main/java/com/example/examplemod/CameraFfmpegEncoder.java \
            src/main/java/com/example/examplemod/CameraExportVerifier.java \
            src/main/java/com/example/examplemod/CameraExportSession.java \
            src/main/java/com/example/examplemod/CameraExportAudioMuxer.java \
            src/test/java/com/example/examplemod/CameraExportCoreSmokeTest.java
          java -ea -cp build/camera/export \
            com.example.examplemod.CameraExportCoreSmokeTest

      - name: Test offline AAC audio mux and remembered FFmpeg preference
        run: |
          mkdir -p build/camera/audio
          javac -source 8 -target 8 -encoding UTF-8 -d build/camera/audio \
            src/main/java/com/example/examplemod/CameraExportAudioMuxer.java \
            src/main/java/com/example/examplemod/CameraExportPreferences.java \
            src/main/java/com/example/examplemod/CameraExportAudioTracks.java \
            src/test/camera-audio-export-stubs/com/example/examplemod/CameraAudioExportStubs.java \
            src/main/java/com/example/examplemod/CameraExportPlan.java \
            src/main/java/com/example/examplemod/CameraExportVerifier.java \
            src/test/java/com/example/examplemod/CameraExportAudioMuxerSmokeTest.java \
            src/test/java/com/example/examplemod/CameraExportAudioTracksSmokeTest.java
          java -ea -cp build/camera/audio \
            com.example.examplemod.CameraExportAudioTracksSmokeTest
          java -ea -cp build/camera/audio \
            com.example.examplemod.CameraExportAudioMuxerSmokeTest

      - name: Test exact native FBO readback and GL state restoration
        run: |
          mkdir -p build/camera/readback
          javac -source 8 -target 8 -encoding UTF-8 -d build/camera/readback \
            src/main/java/com/example/examplemod/CameraExportPlan.java \
            src/main/java/com/example/examplemod/CameraExportReadback.java \
            src/main/java/com/example/examplemod/CameraExportFrameBridge.java \
            src/main/java/com/example/examplemod/CameraExportSession.java \
            src/main/java/com/example/examplemod/CameraExportAudioMuxer.java \
            src/main/java/com/example/examplemod/CameraFfmpegEncoder.java \
            src/main/java/com/example/examplemod/CameraExportVerifier.java \
            src/test/camera-export-stubs/org/lwjgl/BufferUtils.java \
            src/test/camera-export-stubs/org/lwjgl/opengl/GL11.java \
            src/test/camera-export-stubs/org/lwjgl/opengl/GL30.java \
            src/test/camera-export-stubs/net/minecraft/client/shader/Framebuffer.java \
            src/test/java/com/example/examplemod/CameraExportReadbackSmokeTest.java
          java -ea -cp build/camera/readback \
            com.example.examplemod.CameraExportReadbackSmokeTest

      - name: Test buffered export session order, backpressure and cancellation
        run: |
          mkdir -p build/camera/session
          javac -source 8 -target 8 -encoding UTF-8 -d build/camera/session \
            src/main/java/com/example/examplemod/CameraExportPlan.java \
            src/main/java/com/example/examplemod/CameraExportSession.java \
            src/main/java/com/example/examplemod/CameraExportAudioMuxer.java \
            src/main/java/com/example/examplemod/CameraFfmpegEncoder.java \
            src/main/java/com/example/examplemod/CameraExportVerifier.java \
            src/test/java/com/example/examplemod/CameraExportSessionSmokeTest.java
          java -ea -cp build/camera/session \
            com.example.examplemod.CameraExportSessionSmokeTest

      - name: Verify isolated native output-sized PNG probe and safe restoration
        run: |
          mkdir -p build/camera/native-probe
          javac -source 8 -target 8 -encoding UTF-8 -d build/camera/native-probe \
            src/main/java/com/example/examplemod/CameraExportPlan.java \
            src/main/java/com/example/examplemod/CameraExportReadback.java \
            src/main/java/com/example/examplemod/CameraExportFrameBridge.java \
            src/main/java/com/example/examplemod/CameraExportSession.java \
            src/main/java/com/example/examplemod/CameraExportAudioMuxer.java \
            src/main/java/com/example/examplemod/CameraFfmpegEncoder.java \
            src/main/java/com/example/examplemod/CameraExportVerifier.java \
            src/main/java/com/example/examplemod/CameraNativeFrameProbe.java \
            src/test/camera-native-probe-stubs/org/lwjgl/BufferUtils.java \
            src/test/camera-native-probe-stubs/org/lwjgl/opengl/GL11.java \
            src/test/camera-native-probe-stubs/org/lwjgl/opengl/GL13.java \
            src/test/camera-native-probe-stubs/org/lwjgl/opengl/GL30.java \
            src/test/camera-native-probe-stubs/net/minecraft/client/Minecraft.java \
            src/test/camera-native-probe-stubs/net/minecraft/client/shader/Framebuffer.java \
            src/test/camera-native-probe-stubs/net/minecraft/client/gui/GuiScreen.java \
            src/test/camera-native-probe-stubs/net/minecraft/client/renderer/OpenGlHelper.java \
            src/test/camera-native-probe-stubs/net/minecraft/client/renderer/GlStateManager.java \
            src/test/camera-native-probe-stubs/net/minecraftforge/fml/relauncher/ReflectionHelper.java \
            src/test/camera-native-probe-stubs/com/example/examplemod/FrameProbeStubs.java \
            src/test/java/com/example/examplemod/CameraNativeFrameProbeSmokeTest.java
          java -ea -Djava.awt.headless=true -cp build/camera/native-probe \
            com.example.examplemod.CameraNativeFrameProbeSmokeTest

      - name: Check 20TPS clip camera motion at fractional output FPS
        run: |
          mkdir -p build/camera/fractional
          javac -source 8 -target 8 -encoding UTF-8 -d build/camera/fractional \
            src/test/camera-stubs/com/google/gson/JsonElement.java \
            src/test/camera-stubs/com/google/gson/JsonObject.java \
            src/test/camera-stubs/com/google/gson/JsonArray.java \
            src/main/java/com/example/examplemod/PreviewCameraPose.java \
            src/main/java/com/example/examplemod/CameraMathExpression.java \
            src/main/java/com/example/examplemod/CameraClipDocument.java \
            src/main/java/com/example/examplemod/CameraClipChannels.java \
            src/main/java/com/example/examplemod/CameraInterpolation.java \
            src/main/java/com/example/examplemod/CameraClipEnvelope.java \
            src/main/java/com/example/examplemod/CameraClipEvaluator.java \
            src/main/java/com/example/examplemod/CameraExportPlan.java \
            src/main/java/com/example/examplemod/CameraExportCameraSampler.java \
            src/test/java/com/example/examplemod/CameraExportCameraSamplerSmokeTest.java
          java -ea -cp build/camera/fractional \
            com.example.examplemod.CameraExportCameraSamplerSmokeTest

      - name: Verify 30/60 FPS native actor and Jolt render clock
        run: |
          mkdir -p build/camera/fps
          javac -source 8 -target 8 -encoding UTF-8 -d build/camera/fps \
            src/main/java/com/example/examplemod/CameraExportPlan.java \
            src/main/java/com/example/examplemod/CameraExportRenderClock.java \
            src/main/java/com/example/examplemod/CameraExportActorFrameSampler.java \
            src/test/camera-fps-stubs/com/example/examplemod/CameraExportActorFrameStubs.java \
            src/test/java/com/example/examplemod/CameraExportActorFrameSamplerSmokeTest.java
          java -ea -cp build/camera/fps \
            com.example.examplemod.CameraExportActorFrameSamplerSmokeTest

      - name: Verify IMAGE original aspect in horizontal and TikTok frames
        run: |
          mkdir -p build/camera/image-layout
          javac -source 8 -target 8 -encoding UTF-8 -d build/camera/image-layout \
            src/main/java/com/example/examplemod/CameraImagePlacement.java \
            src/test/java/com/example/examplemod/CameraImagePlacementSmokeTest.java
          java -ea -cp build/camera/image-layout \
            com.example.examplemod.CameraImagePlacementSmokeTest

      - name: Verify frame-exact export VIDEO decode with real FFmpeg
        run: |
          mkdir -p build/camera/video-decode
          javac -source 8 -target 8 -encoding UTF-8 -d build/camera/video-decode \
            src/main/java/com/example/examplemod/CameraExportVideoDecoder.java \
            src/test/java/com/example/examplemod/CameraExportVideoDecoderSmokeTest.java \
            src/test/java/com/example/examplemod/CameraExportVideoSeekSmokeTest.java
          java -ea -Djava.awt.headless=true -cp build/camera/video-decode \
            com.example.examplemod.CameraExportVideoDecoderSmokeTest
          java -ea -Djava.awt.headless=true -cp build/camera/video-decode \
            com.example.examplemod.CameraExportVideoSeekSmokeTest

      - name: Test exact VIDEO readiness and GL-thread texture ownership
        run: |
          mkdir -p build/camera/video-frames
          javac -source 8 -target 8 -encoding UTF-8 -d build/camera/video-frames \
            src/main/java/com/example/examplemod/CameraExportVideoDecoder.java \
            src/main/java/com/example/examplemod/CameraExportVideoFrames.java \
            src/main/java/com/example/examplemod/CameraExportPlan.java \
            src/test/camera-video-export-stubs/net/minecraft/client/renderer/texture/DynamicTexture.java \
            src/test/camera-video-export-stubs/com/example/examplemod/VideoClipStubs.java \
            src/test/java/com/example/examplemod/CameraExportVideoFramesSmokeTest.java
          java -ea -Djava.awt.headless=true -cp build/camera/video-frames \
            com.example.examplemod.CameraExportVideoFramesSmokeTest
