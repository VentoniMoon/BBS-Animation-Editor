name: Scene selection search Java 8

on:
  push:
    paths:
      - 'src/main/java/com/example/examplemod/SceneDropdownSearch.java'
      - 'src/test/java/com/example/examplemod/SceneDropdownSearchSmokeTest.java'
      - '.github/workflows/scene-search-java8.yml'
  pull_request:
    paths:
      - 'src/main/java/com/example/examplemod/SceneDropdownSearch.java'
      - 'src/test/java/com/example/examplemod/SceneDropdownSearchSmokeTest.java'
      - 'src/main/java/com/example/examplemod/AnimationEditorInput.java'
      - 'src/main/java/com/example/examplemod/AnimationEditorScreen.java'
      - '.github/workflows/scene-search-java8.yml'

jobs:
  search-java8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile scene search and exercise original-index mapping
        run: |
          mkdir -p build/scene-search-java8
          javac -encoding UTF-8 -d build/scene-search-java8 \
            src/main/java/com/example/examplemod/SceneDropdownSearch.java \
            src/test/java/com/example/examplemod/SceneDropdownSearchSmokeTest.java
          java -cp build/scene-search-java8 \
            com.example.examplemod.SceneDropdownSearchSmokeTest
