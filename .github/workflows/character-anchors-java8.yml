name: Character anchors world matrix and timeline Java 8
on:
  push:
    paths:
      - 'src/main/java/com/example/examplemod/AnchorTransferMath.java'
      - 'src/main/java/com/example/examplemod/CharacterAnchorTransfers.java'
      - 'src/test/anchor-stubs/**'
      - 'src/test/java/com/example/examplemod/CharacterAnchorTransferSmokeTest.java'
      - '.github/workflows/character-anchors-java8.yml'
  pull_request:
    paths:
      - 'src/main/java/com/example/examplemod/AnchorTransferMath.java'
      - 'src/main/java/com/example/examplemod/CharacterAnchorTransfers.java'
      - 'src/main/java/com/example/examplemod/CharacterAnchorPanel.java'
      - 'src/main/java/com/example/examplemod/CharacterAnchorPreview.java'
      - 'src/main/java/com/example/examplemod/CharacterAnchorPoseCache.java'
      - 'src/main/java/com/example/examplemod/CharacterEditorPanel.java'
      - 'src/main/java/com/example/examplemod/BlockbusterActorPreviewRenderer.java'
      - 'src/test/anchor-stubs/**'
      - 'src/test/java/com/example/examplemod/CharacterAnchorTransferSmokeTest.java'
      - '.github/workflows/character-anchors-java8.yml'

jobs:
  anchor-matrix-and-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile and test rigid/mirrored world rebase and ownership on Java 8
        run: |
          mkdir -p build/anchor-java8
          javac -encoding UTF-8 -d build/anchor-java8 \
            $(find src/test/particle-stubs/net/minecraft/nbt -name '*.java') \
            $(find src/test/anchor-stubs -name '*.java') \
            src/main/java/com/example/examplemod/AnimationTransform.java \
            src/main/java/com/example/examplemod/BodyPartPhysicsMatrixSpace.java \
            src/main/java/com/example/examplemod/AnchorTransferMath.java \
            src/main/java/com/example/examplemod/CharacterAnchorTransfers.java \
            src/test/java/com/example/examplemod/CharacterAnchorTransferSmokeTest.java
          java -cp build/anchor-java8 \
            com.example.examplemod.CharacterAnchorTransferSmokeTest
