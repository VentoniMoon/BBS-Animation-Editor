name: Skirt visual physics phase alignment Java 8

on:
  pull_request:
    paths:
      - 'src/main/java/com/example/examplemod/SkirtPoseVisualLead.java'
      - 'src/main/java/com/example/examplemod/BodyPartPhysicsFrameState.java'
      - 'src/main/java/com/example/examplemod/BodyPartsPreviewRenderer.java'
      - 'src/test/java/com/example/examplemod/SkirtPoseVisualLeadSmokeTest.java'
      - 'src/test/phase-stubs/**'
      - '.github/workflows/skirt-phase-java8.yml'
  push:
    branches: [main]
    paths:
      - 'src/main/java/com/example/examplemod/SkirtPoseVisualLead.java'
      - 'src/main/java/com/example/examplemod/BodyPartPhysicsFrameState.java'
      - 'src/main/java/com/example/examplemod/BodyPartsPreviewRenderer.java'
      - 'src/test/java/com/example/examplemod/SkirtPoseVisualLeadSmokeTest.java'
      - 'src/test/phase-stubs/**'
      - '.github/workflows/skirt-phase-java8.yml'
  workflow_dispatch:

jobs:
  skirt-visual-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Verify five-tick skirt timeline without Forge or Jolt JNI
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/skirt-phase"
          javac -source 8 -target 8 -encoding UTF-8 \
            -d "$RUNNER_TEMP/skirt-phase" \
            src/test/phase-stubs/com/example/examplemod/BodyPartModelData.java \
            src/main/java/com/example/examplemod/SkirtClothPoseCoupler.java \
            src/main/java/com/example/examplemod/SkirtAdaptiveWidth.java \
            src/main/java/com/example/examplemod/JoltPhysicsPoseInterpolator.java \
            src/main/java/com/example/examplemod/SkirtPoseVisualLead.java \
            src/main/java/com/example/examplemod/BodyPartPhysicsFrameState.java \
            src/test/java/com/example/examplemod/SkirtPoseVisualLeadSmokeTest.java
          java -ea -cp "$RUNNER_TEMP/skirt-phase" \
            com.example.examplemod.SkirtPoseVisualLeadSmokeTest
