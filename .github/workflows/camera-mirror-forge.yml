      - 'src/main/java/com/example/examplemod/CameraMirrorBetterLightsProbe.java'
      - 'src/main/java/com/example/examplemod/CameraMirrorLightSpace.java'
      - 'src/main/java/com/example/examplemod/CameraMirrorBetterLightsUniforms.java'
      - 'src/main/java/com/example/examplemod/BetterLightsWorldEngine.java'
      - 'src/test/mirror-lights/CameraMirrorLightSpaceSmokeTest.java'
      - 'src/main/java/com/example/examplemod/CameraMirrorPrivateShadowPass.java'
      - 'src/main/java/com/example/examplemod/CameraMirrorShadowMatrix.java'
      - 'src/test/mirror-shadow/CameraMirrorShadowMatrixInvariantTest.java'
      - 'src/main/java/com/example/examplemod/CameraMirrorCompositePlan.java'
      - 'src/main/java/com/example/examplemod/CameraMirrorChunkVisibility.java'
      - 'src/main/java/com/example/examplemod/BlockbusterActorPreviewRenderer.java'
      - 'src/main/java/com/example/examplemod/EditorGizmoController.java'
      - 'src/main/java/com/example/examplemod/EditorEmoticonsRecordPlayback.java'
      - 'src/main/java/com/example/examplemod/BbsFsNativeActorPass.java'
      - 'src/main/java/com/example/examplemod/BbsFsNativeActorSunShadowOverlay.java'
      - 'src/main/java/com/example/examplemod/BbsFsActorShadowSamplingProbe.java'
      - 'src/main/java/com/example/examplemod/BbsFsOptiFineEntityStage.java'
      - 'src/main/java/com/example/examplemod/CameraShaderCurveTransformer.java'
      - 'src/main/java/com/example/examplemod/BbsFsWorldProjection.java'
      - 'src/main/java/com/example/examplemod/EditorSceneViewport.java'
      - 'src/main/java/com/example/examplemod/EditorMultiActorPreviewController.java'
      - 'src/main/java/com/example/examplemod/BbsFsWorldGlGuard.java'
      - 'src/main/java/com/example/examplemod/BbsFsGlStateResync.java'
      - 'src/main/java/com/example/examplemod/BodyPartsPreviewRenderer.java'
      - 'src/main/java/com/example/examplemod/BodyPartsEditorController.java'
  workflow_dispatch:

jobs:
  forge-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Ensure mirror does not start another world or simulation pass
        run: |
          ! grep -q 'entityRenderer.renderWorld(' src/main/java/com/example/examplemod/BbsFsWorldCameraDriver.java
          ! grep -q 'world.setupTerrain(' src/main/java/com/example/examplemod/CameraMirrorTerrainPass.java
          ! grep -q 'world.updateChunks(' src/main/java/com/example/examplemod/CameraMirrorTerrainPass.java
          ! grep -q 'new RenderGlobal(' src/main/java/com/example/examplemod/CameraMirrorTerrainPass.java
          ! grep -q 'new ViewFrustum(' src/main/java/com/example/examplemod/CameraMirrorChunkVisibility.java
          grep -q 'world.renderSky(partialTicks,2)' src/main/java/com/example/examplemod/CameraMirrorTerrainPass.java
          grep -q '\[CapturePath\]' src/main/java/com/example/examplemod/CameraSceneMirrorRenderer.java
          grep -q '\[TerrainDraw\]' src/main/java/com/example/examplemod/CameraMirrorTerrainPass.java
          grep -q 'CameraMirrorNativeAtmosphere.begin' src/main/java/com/example/examplemod/CameraMirrorTerrainPass.java
          grep -q 'atmosphere.sky(partialTicks)' src/main/java/com/example/examplemod/CameraMirrorTerrainPass.java
          grep -q 'atmosphere.terrain(partialTicks)' src/main/java/com/example/examplemod/CameraMirrorTerrainPass.java
          ! grep -q 'world.renderSky(partialTicks,0)' src/main/java/com/example/examplemod/CameraMirrorTerrainPass.java
          grep -q 'infosField.set(global,original)' src/main/java/com/example/examplemod/CameraMirrorChunkVisibility.java
          grep -q 'container.initialize(restoreX,restoreY,restoreZ)' src/main/java/com/example/examplemod/CameraMirrorChunkVisibility.java
          grep -q 'renderPreparedMirror' src/main/java/com/example/examplemod/BlockbusterActorPreviewRenderer.java
          grep -q 'CameraMirrorOptiFineBackend.inspect()' src/main/java/com/example/examplemod/CameraSceneMirrorRenderer.java
          ! grep -q 'Shaders.beginRender(' src/main/java/com/example/examplemod/CameraMirrorOptiFineBackend.java
          ! grep -q 'Shaders.endRender(' src/main/java/com/example/examplemod/CameraMirrorOptiFineBackend.java
          ! grep -q 'renderCompositeFinal()' src/main/java/com/example/examplemod/CameraMirrorOptiFinePreflight.java
          ! grep -q 'Shaders.renderCompositeFinal()' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'bbs.editor.camera.mirrorBSLExperimental' src/main/java/com/example/examplemod/CameraSceneMirrorRenderer.java
          grep -q 'CameraMirrorOptiFinePreflight.runOnce()' src/main/java/com/example/examplemod/CameraSceneMirrorRenderer.java
          grep -q 'installShaderObliqueProjection' src/main/java/com/example/examplemod/CameraMirrorTerrainPass.java
          grep -q 'mirrorBSLProjectionMode' src/main/java/com/example/examplemod/CameraSceneMirrorRenderer.java
          grep -q 'CameraMirrorObliqueProjection.bslCompatible' src/main/java/com/example/examplemod/CameraSceneMirrorRenderer.java
          grep -q 'CameraSceneMirrorRenderer.bslNear' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'CameraMirrorBetterLightsProbe.inspect(pid)' src/main/java/com/example/examplemod/CameraMirrorBetterLightsUniforms.java
          grep -q 'refreshBetterLightsProgram(program,nativePid)' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'CameraMirrorShaderClip.copyUniforms' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'bbsMirrorClipInverseProjection' src/main/java/com/example/examplemod/CameraMirrorShaderClip.java
          grep -q 'gl_FragCoord.z' src/main/java/com/example/examplemod/CameraMirrorShaderClip.java
          grep -q 'GL11.glDisable(GL11.GL_CLIP_PLANE0)' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'writeMatrix(pid,"bbsMirrorClipInverseProjection"' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'injectFragmentClip(fragmentSource)' src/main/java/com/example/examplemod/CameraMirrorShaderClip.java
          grep -q 'bbsMirrorClipPlane' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'CameraMirrorBetterLightsSnapshot.capture' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'CameraMirrorBetterLightsSnapshot.applyToPrivateClone' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'createVertShader' src/main/java/com/example/examplemod/CameraMirrorShaderClip.java
          grep -q 'createFragShader' src/main/java/com/example/examplemod/CameraMirrorShaderClip.java
          grep -q 'CameraMirrorShaderClip.program(nativePid,program)' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'CameraMirrorBetterLightsProbe.inspectAfterRefresh(pid)' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'CameraMirrorLightSpace.matchScreen' src/main/java/com/example/examplemod/CameraMirrorBetterLightsUniforms.java
          grep -q 'nativeMainProjectionMatrix,reflectedProjectionMatrix' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'inspectActiveLights(pid)' src/main/java/com/example/examplemod/CameraMirrorBetterLightsProbe.java
          grep -q 'minimumMirrorDepth' src/main/java/com/example/examplemod/CameraMirrorObliqueProjection.java
          grep -q 'activeMirror.width,activeMirror.height' src/main/java/com/example/examplemod/CameraSceneMirrorRenderer.java
          grep -q 'CameraMirrorBetterLightsUniforms.frameCompleted()' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'GL20.glGetActiveUniform' src/main/java/com/example/examplemod/CameraMirrorBetterLightsProbe.java
          grep -q 'installShaderObliqueProjection' src/main/java/com/example/examplemod/BlockbusterActorPreviewRenderer.java
          grep -q 'CameraMirrorBSLCompositor.runDeferredPasses()' src/main/java/com/example/examplemod/CameraMirrorTerrainPass.java
          grep -q 'gbuffersClearColor' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'GL11.GL_NEAREST' src/main/java/com/example/examplemod/CameraMirrorOptiFineTargets.java
          grep -q 'copyReflectedDirection' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'writeMatrix(pid,"shadowModelView",reflectedShadowView,false)' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'CameraMirrorBSLCompositor.renderPrivateShadows' src/main/java/com/example/examplemod/CameraMirrorTerrainPass.java
          grep -q 'CameraMirrorPrivateShadowPass.acquire' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'CameraMirrorShadowMatrix.fixedWorldAnchor' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'CameraSceneMirrorRenderer.captureMirror()' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'CameraMirrorChunkVisibility.beginShadow' src/main/java/com/example/examplemod/CameraMirrorPrivateShadowPass.java
          grep -q 'verifyFixedWorldAnchor()' src/test/mirror-shadow/CameraMirrorShadowMatrixInvariantTest.java
          grep -q 'nativeEye.lastTickPosX' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'verifyNativeEyeNotPreviewEye()' src/test/mirror-shadow/CameraMirrorShadowMatrixInvariantTest.java
          grep -q 'CameraMirrorChunkVisibility.beginShadow' src/main/java/com/example/examplemod/CameraMirrorPrivateShadowPass.java
          grep -q 'fixedWorldAnchor' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'owner.bindPrivateShadowProgram(optiProgram' src/main/java/com/example/examplemod/CameraMirrorPrivateShadowPass.java
          grep -q 'CameraMirrorBSLCompositor.releaseShadowResources' src/main/java/com/example/examplemod/CameraSceneMirrorRenderer.java
          grep -q 'CameraMirrorBetterLightsUniforms.apply' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'registeredLightPositions()' src/main/java/com/example/examplemod/BetterLightsWorldEngine.java
          grep -q 'UniformBackup.capture(pid,loc,4)' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'CameraMirrorShadowMatrix.rebase' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'bslTargets,reflected,camera' src/main/java/com/example/examplemod/CameraSceneMirrorRenderer.java
          grep -q 'mirrorBSLMaxSize' src/main/java/com/example/examplemod/CameraMirrorOptiFineTargets.java
          grep -q 'GL11.GL_LINEAR' src/main/java/com/example/examplemod/CameraSceneMirrorRenderer.java
          grep -q 'CameraMirrorBSLDenoiser.apply(texture)' src/main/java/com/example/examplemod/CameraSceneMirrorRenderer.java
          grep -q 'CameraMirrorLateComposite.prepare' src/main/java/com/example/examplemod/CameraSceneMirrorRenderer.java
          grep -q 'GL11.glColorMask(true,true,true,false)' src/main/java/com/example/examplemod/CameraMirrorLateComposite.java
          grep -q 'GL11.glColorMask(false,false,false,true)' src/main/java/com/example/examplemod/CameraMirrorLateComposite.java
          grep -q 'renderMask(mc,mirrors,camera)' src/main/java/com/example/examplemod/CameraSceneMirrorRenderer.java
          grep -q 'CameraMirrorLateComposite.composite(mc)' src/main/java/com/example/examplemod/BbsFsWorldFrameCapture.java
          grep -q 'GL30.glBlitFramebuffer' src/main/java/com/example/examplemod/CameraMirrorBSLDenoiser.java
          grep -q 'bindNativeNoiseImage' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'mirrorBSLSkipFinal' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'GL30.GL_RGBA16F' src/main/java/com/example/examplemod/CameraSceneMirrorRenderer.java
          grep -q 'mirrorBSLFinalMode' src/main/java/com/example/examplemod/CameraSceneMirrorRenderer.java
          grep -q 'copyNativeExposureMetadata(nativeColor2)' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'GL30.glBlitFramebuffer(0,0,4,2' src/main/java/com/example/examplemod/CameraMirrorOptiFineTargets.java
          grep -q 'mirrorBSLSkyProgram' src/main/java/com/example/examplemod/CameraMirrorTerrainPass.java
          grep -q 'CameraMirrorBSLCompositor.renderSkyBackdrop()' src/main/java/com/example/examplemod/CameraMirrorTerrainPass.java
          grep -q 'activeProgramField.set(null,program)' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'CameraMirrorBSLCompositor.verifyTerrainProgram' src/main/java/com/example/examplemod/CameraMirrorTerrainPass.java
          grep -q 'CameraMirrorTerrainLightmap.begin()' src/main/java/com/example/examplemod/CameraMirrorTerrainPass.java
          grep -q 'GL11.glScalef(1F/256F' src/main/java/com/example/examplemod/CameraMirrorTerrainLightmap.java
          grep -q 'applyPreFlips("ProgramDeferredPre")' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'applyPreFlips("ProgramCompositePre")' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'copyNumberInt(pid,"worldTime","worldTime")' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          grep -q 'tonemapInMain' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
          ! grep -q 'Shaders.renderDeferred()' src/main/java/com/example/examplemod/CameraMirrorBSLCompositor.java
      - name: Verify BSL-compatible mirror perspective and clipping fallback
        run: |
          mkdir -p /tmp/bbs-mirror-projection-test
          javac -d /tmp/bbs-mirror-projection-test \
            src/main/java/com/example/examplemod/CameraMirrorObliqueProjection.java \
            src/test/java/com/example/examplemod/CameraMirrorObliqueProjectionSmokeTest.java
          java -cp /tmp/bbs-mirror-projection-test \
            com.example.examplemod.CameraMirrorObliqueProjectionSmokeTest
      - name: Verify shadow map is anchored in world space
        run: |
          mkdir -p /tmp/bbs-mirror-shadow-test
          javac -d /tmp/bbs-mirror-shadow-test \
            src/main/java/com/example/examplemod/CameraMirrorShadowMatrix.java \
            src/test/mirror-shadow/CameraMirrorShadowMatrixInvariantTest.java
          java -cp /tmp/bbs-mirror-shadow-test \
            com.example.examplemod.CameraMirrorShadowMatrixInvariantTest
      - name: Verify BetterLights uniform camera-space rebasing
        run: |
          mkdir -p /tmp/bbs-mirror-light-test
          javac -source 8 -target 8 -d /tmp/bbs-mirror-light-test \
            src/main/java/com/example/examplemod/CameraMirrorLightSpace.java \
            src/test/mirror-lights/CameraMirrorLightSpaceSmokeTest.java
          java -cp /tmp/bbs-mirror-light-test \
            com.example.examplemod.CameraMirrorLightSpaceSmokeTest
      - name: Compile entire editor against pinned Forge and mod dependencies
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace -PciDependencies compileJava
