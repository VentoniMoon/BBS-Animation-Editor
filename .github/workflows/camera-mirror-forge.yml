    paths:
      - 'build.gradle'
      - 'src/main/resources/META-INF/accesstransformer.cfg'
      - 'src/main/java/com/example/examplemod/CameraMirrorMath.java'
      - 'src/main/java/com/example/examplemod/CameraMirrorObliqueProjection.java'
