name: CAMERA planar mirror geometry Java 8

on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/com/example/examplemod/CameraMirrorMath.java'
      - 'src/main/java/com/example/examplemod/PreviewCameraPose.java'
      - 'src/test/java/com/example/examplemod/CameraMirrorMathSmokeTest.java'
      - '.github/workflows/camera-mirror-java8.yml'
  pull_request:
    paths:
      - 'src/main/java/com/example/examplemod/CameraMirrorMath.java'
      - 'src/main/java/com/example/examplemod/PreviewCameraPose.java'
      - 'src/test/java/com/example/examplemod/CameraMirrorMathSmokeTest.java'
  workflow_dispatch:

jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile and verify camera reflection and rectangle hitbox
        run: |
          mkdir -p build/mirror-geometry
          javac -source 8 -target 8 -encoding UTF-8 -d build/mirror-geometry \
            src/main/java/com/example/examplemod/PreviewCameraPose.java \
            src/main/java/com/example/examplemod/CameraMirrorMath.java \
            src/test/java/com/example/examplemod/CameraMirrorMathSmokeTest.java
          java -ea -cp build/mirror-geometry \
            com.example.examplemod.CameraMirrorMathSmokeTest
