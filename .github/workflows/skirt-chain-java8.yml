jobs:
  skirt-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Verify 3+2+2 chain topology without Minecraft/JNI
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/skirt-test"
          javac -source 8 -target 8 -encoding UTF-8 \
            -d "$RUNNER_TEMP/skirt-test" \
            src/main/java/com/example/examplemod/SkirtChainTopology.java \
            src/main/java/com/example/examplemod/SkirtGeoProfile.java \
            src/main/java/com/example/examplemod/SkirtClothPoseCoupler.java \
            src/main/java/com/example/examplemod/SkirtConnectedClothSolver.java \
            src/main/java/com/example/examplemod/SkirtClothV2Solver.java \
            src/main/java/com/example/examplemod/SkirtClothSurfaceMesh.java \
            src/main/java/com/example/examplemod/SkirtClothSharedSurface.java \
            src/main/java/com/example/examplemod/SkirtClothRestBinding.java \
            src/main/java/com/example/examplemod/SkirtXPBDPoseSkin.java \
            src/main/java/com/example/examplemod/SkirtXPBDSurfaceTopology.java \
            src/main/java/com/example/examplemod/SkirtXPBDContacts.java \
            src/main/java/com/example/examplemod/SkirtXPBDSolver.java \
            src/main/java/com/example/examplemod/SkirtXPBDRuntime.java \
            src/main/java/com/example/examplemod/SkirtXPBDVolumeSkin.java \
            src/main/java/com/example/examplemod/ChameleonSkirtVolumeSnapshot.java \
            src/main/java/com/example/examplemod/SkirtV2JoltFrameGate.java \
            src/main/java/com/example/examplemod/SkirtRingSeamGeometry.java \
            src/main/java/com/example/examplemod/ChameleonWeldGeometry.java \
            src/main/java/com/example/examplemod/SkirtAdaptiveWidth.java \
            src/main/java/com/example/examplemod/SkirtScaleContactResponse.java \
            src/main/java/com/example/examplemod/SkirtHemContactIslands.java \
            src/main/java/com/example/examplemod/SkirtAdaptiveHemLift.java \
            src/main/java/com/example/examplemod/SkirtSilhouettePreservation.java \
            src/main/java/com/example/examplemod/SkirtHemContinuity.java \
            src/main/java/com/example/examplemod/SkirtVisibleThighContacts.java \
            src/main/java/com/example/examplemod/SkirtLegCollisionProxy.java \
            src/main/java/com/example/examplemod/BodyPartJoltCubeGeometry.java \
            src/main/java/com/example/examplemod/JoltColliderPrimitives.java \
            src/main/java/com/example/examplemod/BodyPartJoltContactBudget.java \
            src/main/java/com/example/examplemod/BodyPartPhysicsRotation.java \
            src/main/java/com/example/examplemod/BodyPartChameleonPhysicsPose.java \
            src/main/java/com/example/examplemod/BodyPartChameleonCleanPose.java \
            src/test/java/com/example/examplemod/SkirtChainTopologySmokeTest.java \
            src/test/java/com/example/examplemod/SkirtGeoProfileSmokeTest.java \
            src/test/java/com/example/examplemod/SkirtClothPoseCouplerSmokeTest.java \
            src/test/java/com/example/examplemod/SkirtConnectedClothSolverSmokeTest.java \
            src/test/java/com/example/examplemod/SkirtClothV2SolverSmokeTest.java \
            src/test/java/com/example/examplemod/SkirtClothSurfaceMeshSmokeTest.java \
            src/test/java/com/example/examplemod/SkirtXPBDPipelineSmokeTest.java \
            src/test/java/com/example/examplemod/SkirtV2JoltFrameGateSmokeTest.java \
            src/test/java/com/example/examplemod/SkirtRingSeamGeometrySmokeTest.java \
            src/test/java/com/example/examplemod/SkirtAdaptiveWidthSmokeTest.java \
            src/test/java/com/example/examplemod/SkirtScaleContactResponseSmokeTest.java \
            src/test/java/com/example/examplemod/SkirtHemContactIslandsSmokeTest.java \
            src/test/java/com/example/examplemod/SkirtAdaptiveHemLiftSmokeTest.java \
            src/test/java/com/example/examplemod/SkirtSilhouettePreservationSmokeTest.java \
            src/test/java/com/example/examplemod/SkirtHemContinuitySmokeTest.java \
            src/test/java/com/example/examplemod/SkirtVisibleThighContactsSmokeTest.java \
            src/test/java/com/example/examplemod/SkirtPostWidthSurfaceSmokeTest.java \
            src/test/java/com/example/examplemod/SkirtLegCollisionProxySmokeTest.java \
            src/test/java/com/example/examplemod/BodyPartJoltContactBudgetSmokeTest.java
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtChainTopologySmokeTest
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtGeoProfileSmokeTest
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtClothPoseCouplerSmokeTest
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtConnectedClothSolverSmokeTest
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtClothV2SolverSmokeTest
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtClothSurfaceMeshSmokeTest
          # Test NEW drape mode with NO rounded bridge colliders.
          java -ea -Dbbs.editor.physics.skirt.xpbd=true \
            -Dbbs.editor.physics.skirt.xpbdSeatedPoseIsolation=true \
            -Dbbs.editor.physics.skirt.xpbdHipBridge=false \
            -Dbbs.editor.physics.skirt.xpbdKneeBridge=false \
            -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtXPBDPipelineSmokeTest
          # Exact prior geometry control: keep old seated reference,
          # with old gravity and silhouette controls unchanged.
          java -ea -Dbbs.editor.physics.skirt.xpbd=true \
            -Dbbs.editor.physics.skirt.xpbdPoseAwareLapGuide=false \
            -Dbbs.editor.physics.skirt.xpbdAdaptiveSeatedGravity=false \
            -Dbbs.editor.physics.skirt.xpbdAdaptiveSeatedShape=false \
            -Dbbs.editor.physics.skirt.xpbdHipBridge=false \
            -Dbbs.editor.physics.skirt.xpbdKneeBridge=false \
            -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtXPBDPipelineSmokeTest
          # Previous PR #248 lap target, still with the two pelvis
          # capsule bridges disabled, to isolate the old native-pose issue.
          java -ea -Dbbs.editor.physics.skirt.xpbd=true \
            -Dbbs.editor.physics.skirt.xpbdRestLengthLapGuide=false \
            -Dbbs.editor.physics.skirt.xpbdDisableHipBridges=true \
            -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtXPBDPipelineSmokeTest
          # Explicit legacy flag may request hip bridges, but the NEW
          # safety switch must override it unless BOTH are opted in.
          java -ea -Dbbs.editor.physics.skirt.xpbd=true \
            -Dbbs.editor.physics.skirt.xpbdHipBridge=true \
            -Dbbs.editor.physics.skirt.xpbdDisableHipBridges=true \
            -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtXPBDPipelineSmokeTest
          # A/B: switch off only posterior gravity relief.
          java -ea -Dbbs.editor.physics.skirt.xpbd=true \
            -Dbbs.editor.physics.skirt.xpbdAdaptiveSeatedGravity=false \
            -Dbbs.editor.physics.skirt.xpbdAdaptiveSeatedShape=true \
            -Dbbs.editor.physics.skirt.xpbdHipBridge=false \
            -Dbbs.editor.physics.skirt.xpbdKneeBridge=false \
            -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtXPBDPipelineSmokeTest
          # A/B: switch off only standing-silhouette relaxation.
          java -ea -Dbbs.editor.physics.skirt.xpbd=true \
            -Dbbs.editor.physics.skirt.xpbdAdaptiveSeatedGravity=true \
            -Dbbs.editor.physics.skirt.xpbdAdaptiveSeatedShape=false \
            -Dbbs.editor.physics.skirt.xpbdHipBridge=false \
            -Dbbs.editor.physics.skirt.xpbdKneeBridge=false \
            -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtXPBDPipelineSmokeTest
          # Exact legacy gravity and shape A/B (walking parity).
          java -ea -Dbbs.editor.physics.skirt.xpbd=true \
            -Dbbs.editor.physics.skirt.xpbdAdaptiveSeatedGravity=false \
            -Dbbs.editor.physics.skirt.xpbdAdaptiveSeatedShape=false \
            -Dbbs.editor.physics.skirt.xpbdHipBridge=false \
            -Dbbs.editor.physics.skirt.xpbdKneeBridge=false \
            -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtXPBDPipelineSmokeTest
          # Isolate original OBB contact momentum on the same 80-degree
          # collision fixtures; never combine it with the default mode.
          java -ea -Dbbs.editor.physics.skirt.xpbd=true \
            -Dbbs.editor.physics.skirt.xpbdPreserveContactVelocity=false \
            -Dbbs.editor.physics.skirt.xpbdSeatedPoseIsolation=true \
            -Dbbs.editor.physics.skirt.xpbdHipBridge=false \
            -Dbbs.editor.physics.skirt.xpbdKneeBridge=false \
            -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtXPBDPipelineSmokeTest
          # The ORIGINAL transport must remain an exact A/B option.
          java -ea -Dbbs.editor.physics.skirt.xpbd=true \
            -Dbbs.editor.physics.skirt.xpbdSeatedPoseIsolation=false \
            -Dbbs.editor.physics.skirt.xpbdHipBridge=false \
            -Dbbs.editor.physics.skirt.xpbdKneeBridge=false \
            -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtXPBDPipelineSmokeTest
          # Verify existing hip/knee contact fixtures independently.
          java -ea -Dbbs.editor.physics.skirt.xpbd=true \
            -Dbbs.editor.physics.skirt.xpbdSeatedPoseIsolation=true \
            -Dbbs.editor.physics.skirt.xpbdHipBridge=true \
            -Dbbs.editor.physics.skirt.xpbdDisableHipBridges=false \
            -Dbbs.editor.physics.skirt.xpbdKneeBridge=true \
            -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtXPBDPipelineSmokeTest
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtV2JoltFrameGateSmokeTest
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtRingSeamGeometrySmokeTest
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtAdaptiveWidthSmokeTest
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtScaleContactResponseSmokeTest
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtHemContactIslandsSmokeTest
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtAdaptiveHemLiftSmokeTest
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtSilhouettePreservationSmokeTest
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtHemContinuitySmokeTest
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtVisibleThighContactsSmokeTest
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtPostWidthSurfaceSmokeTest
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtLegCollisionProxySmokeTest
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.BodyPartJoltContactBudgetSmokeTest
