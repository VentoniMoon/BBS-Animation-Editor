name: Chameleon skirt Bone Cloth topology Java 8

on:
  pull_request:
    paths:
      - 'src/main/java/com/example/examplemod/SkirtChainTopology.java'
      - 'src/main/java/com/example/examplemod/SkirtGeoProfile.java'
      - 'src/main/java/com/example/examplemod/SkirtClothPoseCoupler.java'
      - 'src/main/java/com/example/examplemod/SkirtAdaptiveWidth.java'
      - 'src/main/java/com/example/examplemod/SkirtVisibleThighContacts.java'
      - 'src/main/java/com/example/examplemod/BodyPartJoltContactBudget.java'
      - 'src/main/java/com/example/examplemod/BodyPartEmoticonsFullBodyColliders.java'
      - 'src/main/java/com/example/examplemod/BodyPartPhysicsFrameState.java'
      - 'src/main/java/com/example/examplemod/BodyPartChameleonPhysicsPose.java'
      - 'src/main/java/com/example/examplemod/BodyPartChameleonCleanPose.java'
      - 'src/main/java/com/example/examplemod/BodyPartsPreviewRenderer.java'
      - 'src/main/java/com/example/examplemod/BodyPartSkirtPreset.java'
      - 'src/main/java/com/example/examplemod/BodyPartPhysicsPanel.java'
      - 'src/main/java/com/example/examplemod/BodyPartsEditorPanel.java'
      - 'src/test/java/com/example/examplemod/SkirtChainTopologySmokeTest.java'
      - 'src/test/java/com/example/examplemod/SkirtGeoProfileSmokeTest.java'
      - 'src/test/java/com/example/examplemod/SkirtClothPoseCouplerSmokeTest.java'
      - 'src/test/java/com/example/examplemod/SkirtAdaptiveWidthSmokeTest.java'
      - 'src/test/java/com/example/examplemod/SkirtVisibleThighContactsSmokeTest.java'
      - 'src/test/java/com/example/examplemod/BodyPartJoltContactBudgetSmokeTest.java'
      - '.github/workflows/skirt-chain-java8.yml'
  push:
    branches: [main]
    paths:
      - 'src/main/java/com/example/examplemod/SkirtChainTopology.java'
      - 'src/main/java/com/example/examplemod/SkirtGeoProfile.java'
      - 'src/main/java/com/example/examplemod/SkirtClothPoseCoupler.java'
      - 'src/main/java/com/example/examplemod/SkirtAdaptiveWidth.java'
      - 'src/main/java/com/example/examplemod/SkirtVisibleThighContacts.java'
      - 'src/main/java/com/example/examplemod/BodyPartJoltContactBudget.java'
      - 'src/main/java/com/example/examplemod/BodyPartEmoticonsFullBodyColliders.java'
      - 'src/main/java/com/example/examplemod/BodyPartPhysicsFrameState.java'
      - 'src/main/java/com/example/examplemod/BodyPartChameleonPhysicsPose.java'
      - 'src/main/java/com/example/examplemod/BodyPartChameleonCleanPose.java'
      - 'src/main/java/com/example/examplemod/BodyPartsPreviewRenderer.java'
      - 'src/test/java/com/example/examplemod/SkirtChainTopologySmokeTest.java'
      - 'src/test/java/com/example/examplemod/SkirtGeoProfileSmokeTest.java'
      - 'src/test/java/com/example/examplemod/SkirtClothPoseCouplerSmokeTest.java'
      - 'src/test/java/com/example/examplemod/SkirtAdaptiveWidthSmokeTest.java'
      - 'src/test/java/com/example/examplemod/SkirtVisibleThighContactsSmokeTest.java'
      - 'src/test/java/com/example/examplemod/BodyPartJoltContactBudgetSmokeTest.java'
  workflow_dispatch:

jobs:
  skirt-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Verify 3+2+2 chain topology without Minecraft/JNI
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/skirt-test"
          javac -source 8 -target 8 -encoding UTF-8 \
            -d "$RUNNER_TEMP/skirt-test" \
            src/main/java/com/example/examplemod/SkirtChainTopology.java \
            src/main/java/com/example/examplemod/SkirtGeoProfile.java \
            src/main/java/com/example/examplemod/SkirtClothPoseCoupler.java \
            src/main/java/com/example/examplemod/SkirtAdaptiveWidth.java \
            src/main/java/com/example/examplemod/SkirtVisibleThighContacts.java \
            src/main/java/com/example/examplemod/JoltColliderPrimitives.java \
            src/main/java/com/example/examplemod/BodyPartJoltContactBudget.java \
            src/main/java/com/example/examplemod/BodyPartPhysicsRotation.java \
            src/main/java/com/example/examplemod/BodyPartChameleonPhysicsPose.java \
            src/main/java/com/example/examplemod/BodyPartChameleonCleanPose.java \
            src/test/java/com/example/examplemod/SkirtChainTopologySmokeTest.java \
            src/test/java/com/example/examplemod/SkirtGeoProfileSmokeTest.java \
            src/test/java/com/example/examplemod/SkirtClothPoseCouplerSmokeTest.java \
            src/test/java/com/example/examplemod/SkirtAdaptiveWidthSmokeTest.java \
            src/test/java/com/example/examplemod/SkirtVisibleThighContactsSmokeTest.java \
            src/test/java/com/example/examplemod/BodyPartJoltContactBudgetSmokeTest.java
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtChainTopologySmokeTest
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtGeoProfileSmokeTest
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtClothPoseCouplerSmokeTest
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtAdaptiveWidthSmokeTest
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.SkirtVisibleThighContactsSmokeTest
          java -ea -cp "$RUNNER_TEMP/skirt-test" \
            com.example.examplemod.BodyPartJoltContactBudgetSmokeTest
