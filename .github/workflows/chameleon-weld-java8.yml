name: Chameleon Weld geometry (Java 8)

on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/com/example/examplemod/ChameleonWeld*.java'
      - 'src/main/java/com/example/examplemod/BBSAnimationEditor.java'
      - 'src/test/java/com/example/examplemod/ChameleonWeldGeometrySmokeTest.java'
      - 'src/test/weld-stubs/**'
      - '.github/workflows/chameleon-weld-java8.yml'
  pull_request:
    paths:
      - 'src/main/java/com/example/examplemod/ChameleonWeld*.java'
      - 'src/main/java/com/example/examplemod/BBSAnimationEditor.java'
      - 'src/test/java/com/example/examplemod/ChameleonWeldGeometrySmokeTest.java'
      - 'src/test/weld-stubs/**'
      - '.github/workflows/chameleon-weld-java8.yml'
  workflow_dispatch:

jobs:
  weld-java8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Compile seam solver and check authored hair geometry
        run: |
          mkdir -p build/weld-java8
          javac -source 8 -target 8 -encoding UTF-8 -d build/weld-java8 \
            src/main/java/com/example/examplemod/ChameleonWeldGeometry.java \
            src/test/java/com/example/examplemod/ChameleonWeldGeometrySmokeTest.java
          java -ea -cp build/weld-java8 \
            com.example.examplemod.ChameleonWeldGeometrySmokeTest

      - name: Resolve Forge-compatible ASM 5 fixtures
        run: |
          mkdir -p build/weld-java8/libs
          curl --fail --location --silent --show-error \
            https://repo.maven.apache.org/maven2/org/ow2/asm/asm/5.2/asm-5.2.jar \
            --output build/weld-java8/libs/asm-5.2.jar
          curl --fail --location --silent --show-error \
            https://repo.maven.apache.org/maven2/org/ow2/asm/asm-tree/5.2/asm-tree-5.2.jar \
            --output build/weld-java8/libs/asm-tree-5.2.jar

      - name: Compile native renderer Weld integration on Java 8
        run: |
          ASM_CP="build/weld-java8/libs/asm-5.2.jar:build/weld-java8/libs/asm-tree-5.2.jar"
          javac -source 8 -target 8 -encoding UTF-8 -cp "$ASM_CP" \
            -d build/weld-java8 \
            src/test/weld-stubs/javax/vecmath/Vector3f.java \
            src/test/weld-stubs/mchorse/metamorph/api/morphs/AbstractMorph.java \
            src/test/weld-stubs/net/minecraft/launchwrapper/IClassTransformer.java \
            src/test/weld-stubs/net/minecraft/nbt/NBTTagCompound.java \
            src/test/weld-stubs/mchorse/chameleon/ClientProxy.java \
            src/test/weld-stubs/mchorse/chameleon/lib/data/model/*.java \
            src/main/java/com/example/examplemod/ChameleonWeldGeometry.java \
            src/main/java/com/example/examplemod/ChameleonWeldPreviewPass.java \
            src/main/java/com/example/examplemod/ChameleonWeldRuntime.java \
            src/main/java/com/example/examplemod/ChameleonWeldMorphTransformer.java \
            src/main/java/com/example/examplemod/ChameleonWeldRendererTransformer.java \
            src/test/weld-stubs/com/example/examplemod/ChameleonWeldPreviewCompileSmoke.java \
            src/test/weld-stubs/com/example/examplemod/ChameleonWeldNativeHookSmoke.java

      - name: Verify native hook, model filtering, and exception-safe cleanup
        run: |
          CP="build/weld-java8:build/weld-java8/libs/asm-5.2.jar:build/weld-java8/libs/asm-tree-5.2.jar"
          java -ea -cp "$CP" \
            com.example.examplemod.ChameleonWeldPreviewCompileSmoke
          java -ea -cp "$CP" \
            com.example.examplemod.ChameleonWeldNativeHookSmoke
