name: Ragdoll humanoid skeleton Java 8 smoke

on:
  pull_request:
    paths:
      - 'src/main/java/com/example/examplemod/RagdollSkeletonDefinition.java'
      - 'src/test/java/com/example/examplemod/RagdollSkeletonDefinitionSmokeTest.java'
      - 'src/main/java/com/example/examplemod/RagdollAnatomy.java'
      - 'src/test/java/com/example/examplemod/RagdollAnatomySmokeTest.java'
      - '.github/workflows/ragdoll-skeleton-java8.yml'
  push:
    branches: [main]
    paths:
      - 'src/main/java/com/example/examplemod/RagdollSkeletonDefinition.java'
      - 'src/test/java/com/example/examplemod/RagdollSkeletonDefinitionSmokeTest.java'
      - 'src/main/java/com/example/examplemod/RagdollAnatomy.java'
      - 'src/test/java/com/example/examplemod/RagdollAnatomySmokeTest.java'
      - '.github/workflows/ragdoll-skeleton-java8.yml'
  workflow_dispatch:

jobs:
  rig-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile pure humanoid rig binding and smoke test on Java 8
        run: |
          set -eu
          mkdir -p build/ragdoll-smoke
          javac -source 8 -target 8 -d build/ragdoll-smoke \
            src/main/java/com/example/examplemod/RagdollSkeletonDefinition.java \
            src/test/java/com/example/examplemod/RagdollSkeletonDefinitionSmokeTest.java
          java -cp build/ragdoll-smoke com.example.examplemod.RagdollSkeletonDefinitionSmokeTest
      - name: Verify Emoticons forward and anatomical knee flexion
        run: |
          set -eu
          javac -source 8 -target 8 -d build/ragdoll-smoke \
            src/main/java/com/example/examplemod/RagdollAnatomy.java \
            src/test/java/com/example/examplemod/RagdollAnatomySmokeTest.java
          java -ea -cp build/ragdoll-smoke com.example.examplemod.RagdollAnatomySmokeTest
