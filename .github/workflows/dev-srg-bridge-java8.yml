name: Development SRG/MCP bridge Java 8 smoke

on:
  pull_request:
    paths:
      - 'src/main/java/com/example/examplemod/DevIBlockStateSrgBridgeTransformer.java'
      - 'src/test/java/com/example/examplemod/DevSrgBridgeSmokeTest.java'
      - 'src/test/weld-stubs/net/minecraft/launchwrapper/IClassTransformer.java'
      - '.github/workflows/dev-srg-bridge-java8.yml'
  push:
    branches: [main]
    paths:
      - 'src/main/java/com/example/examplemod/DevIBlockStateSrgBridgeTransformer.java'
      - 'src/test/java/com/example/examplemod/DevSrgBridgeSmokeTest.java'
      - '.github/workflows/dev-srg-bridge-java8.yml'

jobs:
  mcp-aliases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile and inspect vanilla MCP compatibility aliases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/srg-smoke/libs build/srg-smoke/classes
          MAVEN=https://repo.maven.apache.org/maven2/org/ow2/asm
          curl --fail --location --retry 3 "$MAVEN/asm/9.6/asm-9.6.jar" \
            -o build/srg-smoke/libs/asm-9.6.jar
          curl --fail --location --retry 3 "$MAVEN/asm-tree/9.6/asm-tree-9.6.jar" \
            -o build/srg-smoke/libs/asm-tree-9.6.jar
          javac -source 8 -target 8 -encoding UTF-8 \
            -cp 'build/srg-smoke/libs/*' \
            -d build/srg-smoke/classes \
            src/test/weld-stubs/net/minecraft/launchwrapper/IClassTransformer.java \
            src/main/java/com/example/examplemod/DevIBlockStateSrgBridgeTransformer.java \
            src/test/java/com/example/examplemod/DevSrgBridgeSmokeTest.java
          java -ea -cp 'build/srg-smoke/classes:build/srg-smoke/libs/*' \
            com.example.examplemod.DevSrgBridgeSmokeTest
