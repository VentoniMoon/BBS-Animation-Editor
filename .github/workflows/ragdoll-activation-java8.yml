name: RAGDOLL key activation Java 8 regression

on:
  pull_request:
    paths:
      - 'src/main/java/com/example/examplemod/RagdollActivationPolicy.java'
      - 'src/main/java/com/example/examplemod/RagdollEmoticonsJoltBridge.java'
      - 'src/main/java/com/example/examplemod/PhysicsWorkspace.java'
      - 'src/main/java/com/example/examplemod/PhysicsInspectorPanel.java'
      - 'src/test/java/com/example/examplemod/RagdollActivationPolicySmokeTest.java'
      - '.github/workflows/ragdoll-activation-java8.yml'
  push:
    branches: [main]
    paths:
      - 'src/main/java/com/example/examplemod/RagdollActivationPolicy.java'
      - 'src/main/java/com/example/examplemod/RagdollEmoticonsJoltBridge.java'
      - 'src/main/java/com/example/examplemod/PhysicsWorkspace.java'
      - 'src/main/java/com/example/examplemod/PhysicsInspectorPanel.java'
      - 'src/test/java/com/example/examplemod/RagdollActivationPolicySmokeTest.java'
      - '.github/workflows/ragdoll-activation-java8.yml'
  workflow_dispatch:

jobs:
  key-activation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Check first-key activation, old-key compatibility and JVM opt-out
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ragdoll-activation
          javac -source 8 -target 8 -encoding UTF-8 \
            -d build/ragdoll-activation \
            src/main/java/com/example/examplemod/RagdollActivationPolicy.java \
            src/test/java/com/example/examplemod/RagdollActivationPolicySmokeTest.java
          java -ea -cp build/ragdoll-activation \
            com.example.examplemod.RagdollActivationPolicySmokeTest
