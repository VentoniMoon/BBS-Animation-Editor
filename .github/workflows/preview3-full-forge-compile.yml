name: Preview FS full Forge 1.12.2 compile

on:
  pull_request:
    paths:
      - 'build.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'src/main/java/**'
      - 'src/main/resources/**'
      - '.github/workflows/preview3-full-forge-compile.yml'
  workflow_dispatch:

jobs:
  forge-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build against pinned public Minecraft 1.12.2 dependencies
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace -PciDependencies compileJava
