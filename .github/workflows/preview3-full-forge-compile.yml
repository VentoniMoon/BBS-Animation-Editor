name: Preview FS full Forge 1.12.2 compile

on:
  pull_request:
    paths:
      - 'build.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'src/main/java/**'
      - 'src/main/resources/**'
      - '.github/workflows/preview3-full-forge-compile.yml'
  workflow_dispatch:

jobs:
  forge-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build against pinned public Minecraft 1.12.2 dependencies
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace -PciDependencies compileJava
      - name: Assemble reobfuscated test mod jar
        run: |
          ./gradlew --no-daemon --stacktrace -PciDependencies jar
          test -f build/libs/bbs-animation-editor-0.0.2.jar
          jar tf build/libs/bbs-animation-editor-0.0.2.jar | grep -q 'com/example/examplemod/SkirtXPBDContacts.class'
          jar tf build/libs/bbs-animation-editor-0.0.2.jar | grep -q 'com/example/examplemod/CharacterEditorPanel.class'
      - name: Upload test JAR for seated-skirt correction
        uses: actions/upload-artifact@v4
        with:
          name: bbs-animation-editor-0.0.2-seated-skirt-test-jar
          path: build/libs/bbs-animation-editor-0.0.2.jar
          if-no-files-found: error
          retention-days: 30
